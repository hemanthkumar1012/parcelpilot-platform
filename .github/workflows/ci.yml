name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        env:
          SECRET_KEY: test-secret-key-for-pytest-only-32bytes
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m compileall -q app api tests

      - name: Validate SQLite migrations
        env:
          SECRET_KEY: test-secret-key-for-pytest-only-32bytes
          DATABASE_URL: "sqlite:///:memory:"
        run: alembic upgrade head

      - name: Run Pytest (SQLite)
        env:
          SECRET_KEY: test-secret-key-for-pytest-only-32bytes
          DATABASE_URL: "sqlite:///:memory:"
          CORS_ORIGINS: '["http://testserver", "http://localhost:3000"]'
        run: pytest -q --ignore=tests/test_postgres_integration.py

      - name: Validate PostgreSQL migrations
        env:
          SECRET_KEY: test-secret-key-for-pytest-only-32bytes
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb"
        run: alembic upgrade head

      - name: Run Pytest (PostgreSQL Integration)
        env:
          SECRET_KEY: test-secret-key-for-pytest-only-32bytes
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb"
          TEST_DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb"
          CORS_ORIGINS: '["http://testserver", "http://localhost:3000"]'
        run: pytest -q tests/test_postgres_integration.py
